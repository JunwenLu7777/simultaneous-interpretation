name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: uv sync --extra dev
      - name: 静态检查
        run: make lint
      - name: 类型检查
        run: make typecheck
      - name: 测试
        run: make test
      - name: 性能基准
        run: make benchmark
