# 复制为仓库根目录的 config.toml，或复制到：
# ~/.config/teams-voice-interpreter/config.toml
# config.toml 已被 .gitignore 忽略，不要提交真实 API Key。

deepseek_api_key = "sk-your-deepseek-api-key"
deepseek_model = "deepseek-chat"
tts_rate = "+20%"
# v1 默认 TTS 引擎；piper = 本地 ONNX（推荐：快 7x、零网络、零费用、MIT）；
# edge_tts = Microsoft Edge 浏览器免费接口（保留作降级）。
tts_engine = "piper"
# Piper voice 模型目录；留空回落到 ~/.cache/teams-voice-interpreter/piper-models。
# 模型从 https://huggingface.co/rhasspy/piper-voices 下载（默认两个音色：
# en_US-amy-medium / zh_CN-huayan-medium，约 60 MB 各，共 ~120 MB）。
piper_models_dir = ""
uplink_virtual_device_name = "BlackHole 2ch"
downlink_virtual_device_name = "TVI Downlink"
allow_shared_virtual_device = false
vad_backend = "silero"  # 默认 Silero ONNX；webrtc 作为 fallback

web_port = 8765
host = "127.0.0.1"
model_name = "small-q5_1"
# asr_initial_prompt 仅放专有名词词典，不要写描述性句子；small 模型会把长句当 "风格种子"
# 在弱语音段直接生成衍生文本（实测会吐 "这些是普通话口语转写的"、"以下是会议发言" 等）。
asr_initial_prompt = "DeepSeek BlackHole Teams AirPods 同声传译 实时同传"
