allow_shared_virtual_device = false

web_port = 8765
host = "127.0.0.1"
model_name = "large-v3-q5_0"
asr_initial_prompt = """
以下是普通话口语转写，内容可能包含会议发言、技术演示、产品设计、
同声传译软件、优雅设计、新机器、年龄数字和连续提问。
常见词包括：同声传译、实时同传、DeepSeek、BlackHole、Teams、AirPods。
"""
