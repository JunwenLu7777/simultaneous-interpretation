repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --extra dev ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format-check
        name: ruff format --check
        entry: uv run --extra dev ruff format --check .
        language: system
        pass_filenames: false
      - id: mypy-strict
        name: mypy --strict
        entry: uv run --extra dev mypy --strict
        language: system
        pass_filenames: false
      - id: radon-complexity
        name: radon cc -a -nb
        entry: uv run --extra dev radon cc -a -nb src tests
        language: system
        pass_filenames: false
